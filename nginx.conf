# WEB 서비스 (포트 80)
server {
    listen 80;
    server_name _;

    # 백엔드 주소는 요청 시점에 찾습니다. (백엔드 컨테이너가 없어도 nginx 는 정상 기동)
    # docker 기본 DNS 127.0.0.11 / 백엔드 서비스명:포트 는 프로젝트에 맞게 변경
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $was_backend http://server:8080;

    root /usr/share/nginx/html;

    # SPA - 없는 경로는 index.html 로 (vue-router history 모드)
    location / {
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 빌드 파일은 해시가 붙으므로 오래 캐시
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass $was_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # api 동적할당 캐싱문제 방지
    location = /api-config.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires off;
    }
}
