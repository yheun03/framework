name: Deploy GitHub Pages

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: write

concurrency:
    group: gh-pages
    cancel-in-progress: true

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: npm

            - name: Install dependencies
              run: npm ci

            # lint · 포맷 · 단위 테스트 · 문서 예제 · Props 패널 검사 (실패하면 배포하지 않음)
            - name: Check
              run: npm run lint && npm run format:check && npm test && npm run check:docs && npm run check:props

            # 하위 경로(/framework/) 빌드 + SPA 새로고침 대응 404.html
            - name: Build
              run: npm run build:pages

            - name: Publish to gh-pages branch
              uses: peaceiris/actions-gh-pages@v4
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  publish_dir: ./dist
                  publish_branch: gh-pages
                  force_orphan: false
